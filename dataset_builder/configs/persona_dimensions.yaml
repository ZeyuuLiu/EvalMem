# 沟通风格的详细规则（注入到 user_simulator prompt）
communication_style_detailed:
  口语化: |
    - 使用口语词、感叹词（"哎"、"哇"、"嗯"）
    - 句子可不完整，可以有"那个"、"就是"等填充词
    - 偶尔用网络流行语
    - 表情符号可以使用
  简洁直接: |
    - 句子短，一句能说完不要两句
    - 不啰嗦背景
    - 直接提问或陈述
    - 不用感叹词与修饰
  详尽叙述: |
    - 喜欢铺陈背景再提问（"最近发生了一件事..."）
    - 单条消息可以较长（30-60字）
    - 经常带情感色彩与时间描述
  婉转含蓄: |
    - 不直接说事实，倾向用比喻、暗示
    - 多用反问、疑问
    - 情感表达内敛
    - 暴露状态时尤其要委婉，可用"听说"、"有人"等转移视角
  技术腔: |
    - 使用专业术语
    - 表达精确，喜欢用数字、参数
    - 句子结构严密
